[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-mri-segmentation-portfolio"
version = "0.1.0"
description = "Reproducible patient-level U-Net and Attention U-Net segmentation of TCGA-LGG MRI abnormalities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4",
  "streamlit>=1.32,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
